            - generic [ref=e65]:
              - paragraph [ref=e66]: Cooperation agreements are negotiated between your attorney and the prosecution. Mitigation is everything you build independent of the government's process. Both matter. But only one is entirely within your control.
              - 'heading "Cooperation: What It Is and What It Is Not" [level=2] [ref=e67]'
              - paragraph [ref=e68]: Cooperation means providing substantial assistance to the government — information about other criminal activity, testimony against co-conspirators, intelligence that leads to new charges or convictions. When effective, prosecutors file a 5K1.1 motion that allows the judge to sentence below the guideline range.
              - paragraph [ref=e69]: But cooperation is controlled by the prosecution. They decide what qualifies. They decide when to file the motion. You have no guarantee it will happen, even if you provide substantial assistance.
              - 'heading "Mitigation: The Work Only You Can Do" [level=2] [ref=e70]'
              - paragraph [ref=e71]: Mitigation is the record you build to show the judge who you are beyond your worst moment. It includes your character letters, your community service, your therapy, your family circumstances, your professional history, and your documented plan for making amends.
              - blockquote [ref=e72]: "\"The order of mitigation follows: defendant, friends and family, lawyer. Most defendants get the order wrong.\" — Judge Boulware, Federal District Court"
